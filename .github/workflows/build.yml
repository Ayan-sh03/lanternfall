# Builds the Windows .exe and the Android .apk on every push to main, on pull
# requests, and on demand, each twice: the classic game, which starts in the
# flat view, and Lanternfall-3D, which starts in the 3D view. (Either switches
# with F3.) The 3D APK installs alongside the classic one.
#
# Every build of main is published as a release named v1.0.<run number>, with
# the .exe and the .apk attached for direct download. Pushing your own tag
# (v2.0, say) publishes a release under that name instead. Pull requests only
# produce a downloadable artifact.
#
# To sign the APK with your own key (so it can update an installed copy), add
# three repository secrets:
#   ANDROID_KEYSTORE_BASE64    the keystore file, base64-encoded
#   ANDROID_KEYSTORE_USER      the key alias
#   ANDROID_KEYSTORE_PASSWORD  the keystore password
# Without them the APK is signed with a throwaway key made during the run.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
    # A change to the documentation alone is not worth a new release.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows .exe and Android .apk (classic and 3D)
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      GODOT_VERSION: 4.3-stable
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore Godot and its export templates
        id: godot
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}\godot
          key: godot-${{ env.GODOT_VERSION }}-windows-android-1

      - name: Download Godot and its export templates
        if: steps.godot.outputs.cache-hit != 'true'
        shell: pwsh
        run: ./ci/fetch-godot.ps1 -Version $env:GODOT_VERSION -Dest "$env:RUNNER_TEMP\godot"

      - name: Decide the version
        id: version
        shell: pwsh
        run: |
          $name = "1.0.$env:GITHUB_RUN_NUMBER"
          $tag = ""
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $name = $tag.Substring(1)
          } elseif ($env:GITHUB_REF -eq "refs/heads/main") {
            $tag = "v$name"
          }
          "name=$name", "tag=$tag" | Out-File -Append $env:GITHUB_OUTPUT

      - name: Check and build
        shell: pwsh
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >-
          ./ci/build.ps1 -GodotDir "$env:RUNNER_TEMP\godot"
          -VersionName "${{ steps.version.outputs.name }}" -VersionCode $env:GITHUB_RUN_NUMBER

      - uses: actions/upload-artifact@v7
        with:
          name: Lanternfall
          path: |
            build/Lanternfall.exe
            build/Lanternfall.apk
            build/Lanternfall-3D.exe
            build/Lanternfall-3D.apk
          if-no-files-found: error

      - name: Publish the release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lanternfall ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          body: |
            - **Windows:** download `Lanternfall.exe` and run it.
            - **Android:** download `Lanternfall.apk` on the phone and open it (allow installs from your browser or file manager when asked).
            - **3D:** `Lanternfall-3D.exe` and `Lanternfall-3D.apk` are the same game drawn in 3D. Press F3 in either version to switch views. The 3D APK installs alongside the classic one.
          generate_release_notes: true
          files: |
            build/Lanternfall.exe
            build/Lanternfall.apk
            build/Lanternfall-3D.exe
            build/Lanternfall-3D.apk
